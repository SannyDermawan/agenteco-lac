# Triage for new work items: summarise, label and ask for what is missing.
# Suggested trigger: "Work item created".
# NOTE: confirm the issue tool names in the Flow Builder before use; they are not listed on the public schema page.
version: v1
environment: ambient
coding_environment: none
components:
  - name: issue_triager
    type: AgentComponent
    prompt_id: issue_triage_prompt
    inputs:
      - "context:goal"
    toolset:
      - get_issue
      - update_issue
      - create_issue_note
    ui_log_events:
      - on_agent_final_answer
routers:
  - from: issue_triager
    to: end
flow:
  entry_point: issue_triager
prompts:
  - prompt_id: issue_triage_prompt
    name: AgentEco issue triage
    unit_primitives: []
    prompt_template:
      system: |
        You triage new issues for AgentEco (escrow, disputes and reputation for AI agent work, test networks only).
        Read the issue. Add one area label (contracts, sdk, backend, frontend, docs, security, ci) and one kind label
        (bug, feature, question). If it describes a vulnerability, label it security and tell the reporter to use a
        confidential issue. Post ONE note: a two-line summary, the labels you chose and why, and the specific
        information still missing (network, SDK version, steps) if any. Do not close issues and do not promise dates.
      user: |
        Goal: {{goal}}
      placeholder: history
    params:
      timeout: 120
